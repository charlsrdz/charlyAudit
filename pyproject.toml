[project]
name = "charlywebaudit"
version = "0.0.8"
description = "CLI + GUI que orquesta CharlyAudit + un script Playwright real para producir un reporte de auditoria unificado (Playwright + Asistente IA, ambito por ambito)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RedGPS" }]

dependencies = [
    "questionary>=2.0.1",
    "rich>=13.7.1",
    "playwright>=1.45.0",
    "jinja2>=3.1.4",
    "platformdirs>=4.2.2",
    "websockets>=12.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10.0"]
gui = ["tkinterweb>=3.24.0", "pystray>=0.19.5", "pillow>=10.0.0"]

[project.scripts]
charlywebaudit = "charlywebaudit.__main__:main"
charlywebaudit-gui = "charlywebaudit.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["charlywebaudit*"]

[tool.setuptools.package-data]
charlywebaudit = ["report/templates/*.jinja", "vendor/**/*", "gui/assets/*"]
